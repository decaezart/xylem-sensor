name: Auto Scrape Eagle Sensor

on:
  schedule:
    # Mengatur jadwal berjalan setiap 4 jam sekali
    - cron: '0 */4 * * *'
  workflow_dispatch: # Memungkinkan Anda menjalankan skrip secara manual kapan saja dari web GitHub

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and Push Result
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git config --global --add safe.directory '*'
          git add nilaisensor.txt || true
          git commit -m "Update otomatis data sensor terbaru" || echo "Tidak ada perubahan data"
          git push || echo "Tidak ada perubahan untuk di-push"
