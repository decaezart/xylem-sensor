name: Auto Scrape Eagle Sensor

on:
  schedule:
    # Menjalankan scraper setiap 1 jam
    # pada menit ke-17 untuk menghindari beban tinggi di awal jam
    - cron: '17 * * * *'
      timezone: 'Asia/Makassar'

  # Memungkinkan menjalankan scraper secara manual
  workflow_dispatch:

# Memberikan izin GitHub Actions untuk melakukan git push
permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Run Scraper Script
        run: |
          python scraper.py

      - name: Commit and Push Result
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git config --global --add safe.directory "*"

          git add nilaisensor.txt

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data sensor."
          else
            git commit -m "Update otomatis data sensor terbaru"
            git push
          fi
